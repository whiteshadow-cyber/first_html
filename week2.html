<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Routine for Software Development Course </title>
</head>
<body>
    <header>
        <h1>Class Routine for Software Development Course</h1>
        <nav>
            <ul>
                <li><a href="#table">Table</a></li>
                <li><a href="#form">Form</a></li>
                <li><a href="#full routine">Full Routine</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="table">
            <h2>Section 1</h2>
            <table border="1" style="border-collapse: collapse;">
            <caption>Weekly Schedule</caption>
            <thead>
                <tr>
                    <th>Saturday</th>
                    <th>10:40 - 12:20 PM</th>
                    <th>CSE-2340</th>
                    <th>Room SD_Lab-CX402</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>11:30 - 1:10 PM</td>
                    <td>CSE-2340</td>
                    <td>Room SD_Lab-CX402</td>
                </tr>
            </tbody>
            </table>
        </section>
        <section id="form">
            <h2>Form</h2>
            <form>
               <label for="name">Name:</label>
            <input type="text" id="name" name="name" pattern="[A-Za-z ]+" title="Only English letters allowed" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>
                <input type="submit" value="Submit">
            </form>
        </section>
    </main>
</body>
</html>
